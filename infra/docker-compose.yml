# Development database and API for Mokosh.
#
#   docker compose up -d          both services
#   docker compose up -d db       postgres only
#
# The API and the escalation worker run as two services off one image, because
# the API records alerts and the worker is what promotes an unacknowledged one
# after ESCALATE_UNSAFE_AFTER_MINUTES. They share a database, so either can be
# restarted without losing an alert.

name: mokosh

x-app: &app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-mokosh}:${POSTGRES_PASSWORD:-mokosh}@db:5432/${POSTGRES_DB:-mokosh}
    CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
    CLERK_ISSUER: ${CLERK_ISSUER:-}
    # Android push (FCM HTTP v1)
    FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
    FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
    FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
    # iOS push (APNs .p8 key, newlines escaped as \n)
    APNS_KEY_ID: ${APNS_KEY_ID:-}
    APNS_TEAM_ID: ${APNS_TEAM_ID:-}
    APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.example.safety}
    APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
    APNS_USE_SANDBOX: ${APNS_USE_SANDBOX:-true}
    # Email for danger alerts; blank SMTP_HOST disables it
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    EMAIL_FROM: ${EMAIL_FROM:-Safety Alert <alerts@safetyapp.example>}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    APP_LINK_SCHEME: ${APP_LINK_SCHEME:-safetyapp}
    ESCALATE_UNSAFE_AFTER_MINUTES: ${ESCALATE_UNSAFE_AFTER_MINUTES:-15}
    ESCALATE_DANGER_AFTER_MINUTES: ${ESCALATE_DANGER_AFTER_MINUTES:-5}
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mokosh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mokosh}
      POSTGRES_DB: ${POSTGRES_DB:-mokosh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mokosh} -d ${POSTGRES_DB:-mokosh}",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    <<: *app
    command: ["node", "dist/server.js"]
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *app
    # No port: the worker only sweeps the alerts table.
    command: ["node", "dist/worker.js"]

volumes:
  pgdata: