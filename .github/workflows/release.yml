name: release

# Tag a commit matching v* and this builds the release APK and attaches it to the
# GitHub Release. v0.1.0 through v0.2.0 were built by hand on a laptop; this makes
# the artifact reproducible from the tag alone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: android release apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: resolve tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # app.json is the source of truth for the version shown on the device, so the
      # tag is written into it before prebuild. versionCode must strictly increase
      # for an upgrade to install over an existing install.
      - name: set version from tag
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const [major, minor, patch] = version.split(".").map(Number);
            const code = major * 10000 + minor * 100 + patch;
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.version = version;
            config.expo.android.versionCode = code;
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
            console.log(`version=${version} versionCode=${code}`);
          '
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      # An APK with no EAS project id installs and runs, and then cannot mint an
      # Expo push token — so the account can never alert a friend. The build looks
      # completely fine, which is exactly why this is a gate and not a warning.
      - name: require the EAS project id
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::EAS_PROJECT_ID repository variable is missing, so the APK could not register for push."
            echo "Add it with: gh variable set EAS_PROJECT_ID --body \"<uuid from eas init>\""
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.extra = { ...config.expo.extra, eas: { projectId: process.env.EAS_PROJECT_ID } };
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
            console.log(`eas.projectId=${process.env.EAS_PROJECT_ID}`);
          '

      - name: require the backend URL
        # Without this the APK points at nothing and every screen that needs data
        # fails against localhost. A variable rather than a secret: it is a URL.
        env:
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::EXPO_PUBLIC_API_URL repository variable is missing."
            echo "Add it with: gh variable set EXPO_PUBLIC_API_URL --body \"https://<host>\""
            exit 1
          fi

      - name: require the Clerk publishable key
        # An APK whose EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY is empty builds
        # successfully and installs successfully, then fails at runtime the moment
        # anyone tries to sign in. Refusing to build is much cheaper than shipping
        # that, so this is a hard gate rather than a default.
        env:
          CLERK_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$CLERK_KEY" ] || [ "${CLERK_KEY#pk_}" = "$CLERK_KEY" ]; then
            echo "::error::EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY secret is missing or is not a pk_* key."
            echo "Add it with: gh secret set EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY"
            exit 1
          fi
          echo "Clerk key present (${#CLERK_KEY} chars)."

      - name: write .env
        # Only EXPO_PUBLIC_* values are inlined into the JS bundle, so a
        # publishable Clerk key is the only thing needed here. There is no server
        # secret in an APK by construction.
        run: |
          {
            echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
            echo "EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL }}"
          } > .env

      - name: prebuild
        run: npx expo prebuild --platform android --clean

      - name: assemble release apk
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: collect artifact
        id: collect
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          mv "$apk" app-release.apk
          sha256sum app-release.apk | tee digest.txt

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/app-release.apk
          generate_release_notes: true
          body: |
            Android release APK for `${{ github.ref_name }}`.

            SHA-256 of the attached APK:

            ```
            $(cat digest.txt)
            ```

            Debug-key signed, so this installs over earlier releases rather than
            replacing them.

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-diagnostics
          path: app/digest.txt
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/app-release.apk
          retention-days: 14
