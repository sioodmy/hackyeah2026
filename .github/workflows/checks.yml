name: checks

# Mirrors `just check`: typecheck, prettier, and the vitest suite. There was no
# CI before, which is how a PR that unauthenticated an endpoint full of assault
# reports reached main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (typecheck, prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx prettier --check "src/**/*.{ts,tsx}"

  backend:
    name: backend (typecheck, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # No Postgres service: the suite runs on PGlite, an in-process Postgres,
    # so nothing has to be provisioned or torn down around it.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"
      - run: npm test
