name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - feat/hackathon-landing-page
    paths:
      - "landing/**"
      - "web/src/**"
      - "app/src/theme/**"
      - "app/src/lib/avatar.ts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Landing Page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            web/package-lock.json

      - name: Install landing dependencies
        run: npm ci

      # Sekcja demo to kod z `web/src`, więc TS/Vite muszą widzieć `web`'s
      # zależności (react, maplibre-gl) z `web/node_modules` — sama instalacja
      # w `landing/` ich nie dostarcza i build padał na "Cannot find module
      # 'react'". Uwaga: tego katalogu NIE da się zastąpić `landing/node_modules`,
      # bo Node szuka `node_modules` w górę od importującego pliku, a
      # `landing/` nie jest przodkiem `web/src/`.
      - name: Install demo dependencies
        working-directory: web
        run: npm ci

      - name: Build site with Vite
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
