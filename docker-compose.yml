name: safe-call

services:
  postgres:
    image: postgres:17-alpine
    container_name: safe-call-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safecall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safecall}
      POSTGRES_DB: ${POSTGRES_DB:-safecall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-safecall} -d ${POSTGRES_DB:-safecall}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  adminer:
    image: adminer:5
    container_name: safe-call-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: safe-call-server
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-safecall}:${POSTGRES_PASSWORD:-safecall}@postgres:5432/${POSTGRES_DB:-safecall}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      INVITE_SIGNING_SECRET: ${INVITE_SIGNING_SECRET:-safe-call-dev-invite-secret}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    ports:
      - "4000:4000"

volumes:
  pgdata:
